name: Validate community node

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
